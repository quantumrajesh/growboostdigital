<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Grow Boost Digital</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .error-page h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .error-page p {
            margin-bottom: 2rem;
            color: #a1a1a6;
        }

        .error-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .error-links a {
            color: #2997ff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <h1>Oops! Page Not Found</h1>
        <p>This page doesn’t exist. Try the links below to get back on track:</p>
        <ul class="error-links">
            <li><a href="/">Home</a></li>
            <li><a href="/#services">Services</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>
    </div>
</body>

</html>
